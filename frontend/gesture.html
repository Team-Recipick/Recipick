<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 9px;
            font-family: sans-serif;
            background: rgba(0,0,0,0.55);
            padding: 2px 0;
            letter-spacing: 0.3px;
        }
        #gesture-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
        }
        #gesture-flash.show { opacity: 1; }
        </style>
    </head>
    <body>
        <video id="video" autoplay playsinline muted></video>
        <div id="gesture-flash"></div>
        <div id="status">초기화 중...</div>

        <script type="module">
        import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs';

        const WASM_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm';
        const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const flashEl = document.getElementById('gesture-flash');

        let handLandmarker = null;
        let lastVideoTime = -1;
        let frameCount = 0;

        const COOLDOWN_TICKS = 30;
        let palmCooldown = 0;
        let okCooldown = 0;
        let peaceCooldown = 0;
        let pointCooldown = 0;
        let fingerCooldown = 0;

        // cook.tsx가 타이머 모달 상태를 injectJavaScript로 제어
        let fingerMode = false;

        window.enterFingerCountMode = () => {
            fingerMode = true;
            fingerCooldown = COOLDOWN_TICKS;
            setStatus('손가락 수로 타이머 설정 (1~5개)');
        };
        window.exitFingerCountMode = () => {
            fingerMode = false;
            setStatus('손 인식 중...');
        };

        function setStatus(msg) { statusEl.textContent = msg; }

        function showFlash(emoji) {
            flashEl.textContent = emoji;
            flashEl.classList.add('show');
            setTimeout(() => flashEl.classList.remove('show'), 600);
        }

        function sendGesture(gesture) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(gesture);
            }
        }

        function isFingerExtended(lm, tipIdx, mcpIdx) {
            return lm[tipIdx].y < lm[mcpIdx].y;
        }

        // 엄지 포함 1~5개 카운트 (fingerMode 전용)
        function countExtendedFingers(lm) {
            let count = 0;
            // 검지~소지 먼저 카운트
            for (const [tip, mcp] of [[8,5],[12,9],[16,13],[20,17]]) {
                if (lm[tip].y < lm[mcp].y) count++;
            }
            // 엄지는 나머지 4개가 모두 펴졌을 때만 체크 (오감지 방지)
            if (count === 4) {
                const thumbToIndexBase = Math.hypot(lm[4].x - lm[5].x, lm[4].y - lm[5].y);
                if (thumbToIndexBase > 0.15) count++;
            }
            return count;
        }

        function classifyStaticGesture(lm) {
            const indexExt  = isFingerExtended(lm, 8,  5);
            const middleExt = isFingerExtended(lm, 12, 9);
            const ringExt   = isFingerExtended(lm, 16, 13);
            const pinkyExt  = isFingerExtended(lm, 20, 17);

            if (indexExt && middleExt && ringExt && pinkyExt) return 'PALM';
            if (indexExt && middleExt && !ringExt && !pinkyExt) return 'PEACE';

            const dist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
            if (dist < 0.07 && middleExt && ringExt && pinkyExt) return 'OK';

            return null;
        }

        // 검지만 펴서 가리키는 방향으로 단계 이동
        function classifyPointGesture(lm) {
            const indexExt  = isFingerExtended(lm, 8,  5);
            const middleExt = isFingerExtended(lm, 12, 9);
            const ringExt   = isFingerExtended(lm, 16, 13);
            const pinkyExt  = isFingerExtended(lm, 20, 17);

            if (!indexExt || middleExt || ringExt || pinkyExt) return null;

            const dx = lm[8].x - lm[5].x;
            const dy = Math.abs(lm[8].y - lm[5].y);
            if (Math.abs(dx) < 0.08 || Math.abs(dx) < dy * 0.8) return null;

            // 전면 카메라는 데이터 좌우 반전: dx>0(데이터 우) = 화면 좌 = 이전 단계
            return dx > 0 ? 'POINT_LEFT' : 'POINT_RIGHT';
        }

        function detectionLoop() {
            if (!handLandmarker || video.readyState < 2) {
                requestAnimationFrame(detectionLoop);
                return;
            }

            frameCount++;
            if (frameCount % 3 !== 0) { requestAnimationFrame(detectionLoop); return; }
            if (video.currentTime === lastVideoTime) { requestAnimationFrame(detectionLoop); return; }
            lastVideoTime = video.currentTime;

            let results;
            try { results = handLandmarker.detectForVideo(video, performance.now()); }
            catch (e) { requestAnimationFrame(detectionLoop); return; }

            if (palmCooldown  > 0) palmCooldown--;
            if (okCooldown    > 0) okCooldown--;
            if (peaceCooldown > 0) peaceCooldown--;
            if (pointCooldown > 0) pointCooldown--;
            if (fingerCooldown > 0) fingerCooldown--;

            if (results?.landmarks?.length > 0) {
                const lm = results.landmarks[0];

                // 타이머 모달이 열려 있을 때: 손가락 개수만 인식
                if (fingerMode) {
                    if (fingerCooldown === 0) {
                        const count = countExtendedFingers(lm);
                        if (count >= 1 && count <= 5) {
                            const emojis = ['☝️', '✌️', '🤟', '🖖', '✋'];
                            showFlash(emojis[count - 1]);
                            sendGesture('FINGER_COUNT_' + count);
                            fingerCooldown = COOLDOWN_TICKS * 3;
                        }
                    }
                    requestAnimationFrame(detectionLoop);
                    return;
                }

                // 일반 제스처 인식
                const gesture = classifyStaticGesture(lm);
                if (gesture === 'PALM' && palmCooldown === 0) {
                    sendGesture('PALM'); showFlash('✋'); palmCooldown = COOLDOWN_TICKS * 2;
                } else if (gesture === 'PEACE' && peaceCooldown === 0) {
                    sendGesture('PEACE'); showFlash('✌️'); peaceCooldown = COOLDOWN_TICKS * 3;
                } else if (gesture === 'OK' && okCooldown === 0) {
                    sendGesture('OK'); showFlash('👌'); okCooldown = COOLDOWN_TICKS * 2;
                } else if (!gesture) {
                    const pointGesture = classifyPointGesture(lm);
                    if (pointGesture && pointCooldown === 0) {
                        sendGesture(pointGesture);
                        showFlash(pointGesture === 'POINT_LEFT' ? '👈' : '👉');
                        pointCooldown = COOLDOWN_TICKS * 2;
                    }
                }
            }

            requestAnimationFrame(detectionLoop);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
                    audio: false,
                });
                video.srcObject = stream;
                video.addEventListener('loadeddata', () => {
                    setStatus('손 인식 중...');
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage('MEDIAPIPE_READY');
                    }
                    detectionLoop();
                });
            } catch (e) {
                setStatus('카메라 오류: ' + e.message);
            }
        }

        try {
            setStatus('MediaPipe 로딩 중...');
            const filesetResolver = await FilesetResolver.forVisionTasks(WASM_CDN);
            handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
                baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
                runningMode: 'VIDEO',
                numHands: 1,
                minHandDetectionConfidence: 0.5,
                minHandPresenceConfidence: 0.5,
                minTrackingConfidence: 0.5,
            });
            setStatus('카메라 시작 중...');
            await startCamera();
        } catch (e) {
            setStatus('초기화 오류: ' + e.message);
        }
        </script>
    </body>
</html>
